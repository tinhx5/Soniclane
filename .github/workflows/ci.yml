name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install system dependencies (Linux SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test
