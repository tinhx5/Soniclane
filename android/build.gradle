allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    if (project.name != "app" && !project.extensions.extraProperties.has("flutter")) {
        project.extensions.extraProperties.set("flutter", [
            compileSdkVersion: 36,
            minSdkVersion: 23,
            targetSdkVersion: 35,
            ndkVersion: "28.2.13676358"
        ])
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
