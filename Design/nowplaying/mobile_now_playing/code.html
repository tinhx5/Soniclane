} } }</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-14 h-14 min-h-[56px] min-w-[56px] rounded-full flex items-center justify-center text-on-surface hover:text-secondary hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[28px]">home</span></button><div class="flex items-center bg-surface-container-high/60 p-1 rounded-full border border-outline-variant/20"><button class="px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 bg-primary/20 text-primary border border-primary/30" id="mode-audio"><span class="material-symbols-outlined text-sm">music_note</span>Audio</button><button class="px-3.5 py-1.5 rounded-full text-xs font-medium text-on-surface-variant flex items-center gap-1.5 hover:text-on-surface" id="mode-video"><span class="material-symbols-outlined text-sm">smart_display</span>Video</button></div></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full text-on-surface select-none pb-space-lg">

<div class="px-space-md mt-space-sm flex items-center justify-between">

<button aria-label="Add to favorites" class="w-14 h-14 min-h-[56px] min-w-[56px] rounded-full flex items-center justify-center text-primary-container hover:bg-surface-container active:scale-90 transition-transform" id="favorite-toggle">
<span class="material-symbols-outlined text-[32px]" id="favorite-icon" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>

<div class="px-space-md mt-space-md">
<div class="relative w-full py-3 flex items-center group cursor-pointer" id="scrubber-track">
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden relative">
<div class="h-full bg-gradient-to-r from-primary-container to-secondary-container w-[46%] rounded-full" id="progress-bar"></div>
</div>
<div class="absolute left-[46%] -translate-x-1/2 w-5 h-5 bg-on-surface rounded-full shadow-lg shadow-primary-container/50 scale-100 group-hover:scale-125 transition-transform flex items-center justify-center pointer-events-none" id="progress-thumb">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
</div>
</div>
<div class="flex justify-between items-center px-0.5 -mt-1 font-label-sm text-label-sm text-on-surface-variant">
<span id="time-current">01:45</span>
<span id="time-remaining">-02:05</span>

<span class="material-symbols-outlined text-[28px]">shuffle</span>
</button>
<button aria-label="Previous track" class="relative w-14 h-14 min-h-[56px] min-w-[56px] rounded-full flex items-center justify-center text-on-surface hover:text-secondary-fixed active:scale-95 transition-all">
<span class="material-symbols-outlined text-[34px]">skip_previous</span>
</button>
<button aria-label="Pause" class="w-20 h-20 min-h-[80px] min-w-[80px] rounded-full bg-gradient-to-br from-primary-container to-primary flex items-center justify-center text-on-primary-container shadow-xl active:scale-95 transition-transform" id="play-pause-btn">
<span class="material-symbols-outlined text-[44px]" id="play-pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>

<span class="material-symbols-outlined text-[34px]">skip_next</span>
</button>

<span class="material-symbols-outlined text-[28px]">repeat</span>

</div>

<span class="material-symbols-outlined text-[24px]">speed</span>
<span class="font-label-sm text-label-sm mt-1">1.0x</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[56px] min-h-[56px] text-on-surface-variant hover:text-on-surface active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">graphic_eq</span>
<span class="font-label-sm text-label-sm mt-1">Bass Boost</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[56px] min-h-[56px] text-on-surface-variant hover:text-on-surface active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">bedtime</span>
<span class="font-label-sm text-label-sm mt-1">Timer</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[56px] min-h-[56px] text-on-surface-variant hover:text-on-surface active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">spatial_audio_off</span>
<span class="font-label-sm text-label-sm mt-1">Dolby</span>
</button>
</div>
</div>
</div>
<script>
  (() => {
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    let isPlaying = true;

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    const favBtn = document.getElementById('favorite-toggle');
    const favIcon = document.getElementById('favorite-icon');
    let isFav = true;

    if (favBtn && favIcon) {
      favBtn.addEventListener('click', () => {
        isFav = !isFav;
        favIcon.style.fontVariationSettings = isFav ? "'FILL' 1" : "'FILL' 0";
        favBtn.classList.toggle('text-primary-container', isFav);
        favBtn.classList.toggle('text-on-surface-variant', !isFav);
      });
    }

    const audioBtn = document.getElementById('mode-audio');
    const videoBtn = document.getElementById('mode-video');

    if (audioBtn && videoBtn) {
      audioBtn.addEventListener('click', () => {
        audioBtn.className = "flex items-center gap-1.5 px-4 py-2 min-h-[44px] rounded-full bg-surface-bright text-on-surface shadow-sm font-label-md text-label-md transition-all";
        videoBtn.className = "flex items-center gap-1.5 px-4 py-2 min-h-[44px] rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all";
      });

      videoBtn.addEventListener('click', () => {
        videoBtn.className = "flex items-center gap-1.5 px-4 py-2 min-h-[44px] rounded-full bg-surface-bright text-on-surface shadow-sm font-label-md text-label-md transition-all";
        audioBtn.className = "flex items-center gap-1.5 px-4 py-2 min-h-[44px] rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all";
      });
    }

    const track = document.getElementById('scrubber-track');
    const progressBar = document.getElementById('progress-bar');
    const progressThumb = document.getElementById('progress-thumb');
    const currentTimeEl = document.getElementById('time-current');

    if (track && progressBar && progressThumb && currentTimeEl) {
      track.addEventListener('click', (e) => {
        const rect = track.getBoundingClientRect();
        const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const percentage = Math.round((clickX / rect.width) * 100);
        
        progressBar.style.width = percentage + '%';
        progressThumb.style.left = percentage + '%';

        const totalSeconds = 230;
        const currentSec = Math.floor((percentage / 100) * totalSeconds);
        const mins = String(Math.floor(currentSec / 60)).padStart(2, '0');
        const secs = String(currentSec % 60).padStart(2, '0');
        currentTimeEl.textContent = `${mins}:${secs}`;
      });
    }
  })();
</script></main>
